# ============================================================
# Order Pool — Netlify configuration
# ============================================================

[build]
  publish = "."
  # Static site, no build step

# Pretty URLs: /contact -> contact.html
# (Netlify also strips trailing slashes by default.)
[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

[build.processing.css]
  bundle = false
  minify = true

[build.processing.js]
  bundle = false
  minify = true

[build.processing.images]
  compress = true

# ------------------------------------------------------------
# Headers
# ------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options       = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ------------------------------------------------------------
# Redirects
# Netlify auto-uses 404.html for unmatched routes.
# Force lowercase on legacy admin links just in case any old
# capitalised hrefs slip in.
# ------------------------------------------------------------
[[redirects]]
  from = "/Orderpool-admin-*"
  to   = "/orderpool-admin-:splat"
  status = 301
  force = true

# Make /admin go straight to the admin index
[[redirects]]
  from = "/admin"
  to   = "/orderpool-admin-index"
  status = 302

# Catch-all 404 (Netlify normally handles this automatically,
# but declaring it makes intent explicit).
[[redirects]]
  from = "/*"
  to   = "/404.html"
  status = 404
