<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quote Request — Manufacturer — Order Pool</title>
  <meta name="description" content="Manufacturer view of a quote request detail. Accepting converts it into an order." />
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen,Ubuntu,Cantarell,sans-serif;line-height:1.6;color:#0f172a;background:#fff}

    header{background:#fff;border-bottom:1px solid #e5e7eb;padding:1rem 2rem;position:sticky;top:0;z-index:100}
    .topnav{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:1.5rem}
    .brand{display:flex;align-items:center;gap:.75rem;text-decoration:none;color:#0f172a;font-weight:800;min-width:180px}
    .brand img{width:34px;height:34px;object-fit:contain}
    .nav-links{display:flex;gap:1.5rem;list-style:none;flex:1;justify-content:center;flex-wrap:wrap}
    .nav-links a{color:#64748b;text-decoration:none;font-weight:850;font-size:.95rem}
    .nav-links a[aria-current="page"]{color:#0f172a;font-weight:950}
    .nav-links a:hover{color:#0f172a}
    .nav-actions{display:flex;gap:.75rem;min-width:220px;justify-content:flex-end;flex-wrap:wrap}

    .btn{padding:.65rem 1.15rem;border-radius:10px;font-size:.95rem;font-weight:850;border:1px solid transparent;background:none;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:.45rem;white-space:nowrap}
    .btn-primary{background:#3d20ae;color:#fff;border-color:#3d20ae}
    .btn-primary:hover{filter:brightness(.97)}
    .btn-secondary{background:#fff;color:#0f172a;border-color:#e5e7eb}
    .btn-secondary:hover{background:#f8fafc}
    .btn-danger{background:#fff;color:#b91c1c;border-color:#fecaca}
    .btn-danger:hover{background:#fff5f5}

    main{max-width:1200px;margin:0 auto;padding:3rem 2rem 2.5rem}
    .section{margin-bottom:2rem}
    h1{font-size:2.6rem;font-weight:950;letter-spacing:-.02em;margin-bottom:.35rem}
    h2{font-size:1.6rem;font-weight:950;margin-bottom:.4rem}
    h3{font-size:1.05rem;font-weight:950}
    p{color:#475569}
    .lead{font-size:1.05rem;max-width:920px}
    .muted{color:#64748b;font-weight:800}

    .chips{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}
    .chip{padding:.55rem .85rem;border-radius:999px;border:1px solid #e5e7eb;background:#fff;font-weight:900;font-size:.85rem;color:#334155}
    .chip.good{background:rgba(16,185,129,.10);border-color:rgba(16,185,129,.25);color:#047857}
    .chip.blue{background:rgba(61,32,174,.08);border-color:rgba(61,32,174,.18);color:#3d20ae}

    .grid{display:grid;grid-template-columns:1.25fr .75fr;gap:1.25rem;margin-top:1.25rem}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:1.5rem;display:flex;flex-direction:column;gap:.85rem}
    .card p{color:#475569}

    .kv{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
    .kv .box{border:1px solid #e5e7eb;border-radius:16px;padding:1rem;background:#fafcff}
    .kv strong{display:block;font-weight:950;margin-bottom:.15rem}
    .kv span{color:#64748b;font-weight:850}

    .files{display:flex;flex-direction:column;gap:.6rem;margin-top:.25rem}
    .file{display:flex;align-items:center;justify-content:space-between;gap:.75rem;border:1px solid #e5e7eb;border-radius:16px;padding:.85rem;background:#fff}
    .file a{color:#0f172a;text-decoration:none;font-weight:950}
    .file a:hover{text-decoration:underline}
    .file small{color:#64748b;font-weight:850}

    .actions{display:flex;gap:.75rem;flex-wrap:wrap;margin-top:.5rem}

    .note{border:1px dashed #cbd5e1;border-radius:18px;padding:1rem;background:linear-gradient(135deg,rgba(61,32,174,.06),rgba(125,92,255,.06))}
    .note strong{display:block;font-weight:950;margin-bottom:.25rem}

    footer{border-top:1px solid #e5e7eb;background:#fff}
    .footer-inner{max-width:1200px;margin:0 auto;padding:1.25rem 2rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
    .footer-left{display:flex;align-items:center;gap:.6rem;font-weight:950;color:#0f172a}
    .footer-left img{width:26px;height:26px;object-fit:contain}
    .footer-links{display:flex;gap:1.1rem;flex-wrap:wrap}
    .footer-links a{text-decoration:none;color:#64748b;font-weight:850;font-size:.92rem}
    .footer-links a:hover{color:#0f172a}
    .footer-meta{font-size:.8rem;color:#94a3b8;font-weight:850}

    @media(max-width:1000px){
      main{padding:2.5rem 1.25rem 2rem}
      header{padding:1rem 1.25rem}
      .topnav{flex-wrap:wrap;justify-content:center}
      .brand{min-width:auto}
      .nav-actions{min-width:auto}
      h1{font-size:2.2rem}
      .grid{grid-template-columns:1fr}
      .kv{grid-template-columns:1fr}
    }
  </style>
</head>

    <div class="topnav">
      <a href="/manufacturer-dashboard-full.html" class="brand">
        <img src="Order
